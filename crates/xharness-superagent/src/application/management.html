<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XHarness SuperAgent 管理</title><style>
body{font:15px/1.6 system-ui,sans-serif;max-width:1080px;margin:30px auto;padding:0 20px;color:#182030;background:#f5f7fa}section{background:white;padding:18px;margin:16px 0;border:1px solid #d5dce5;border-radius:8px}button,select,textarea{font:inherit}button{margin:4px;padding:5px 12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}textarea{box-sizing:border-box;width:100%;min-height:180px}#error{color:#a00000}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}.muted{color:#536173}
</style><h1>XHarness SuperAgent</h1><p class="muted">业务管理入口 · 仅本机监听 · 账号更换会受控重启，先结束并回收旧进程，再验证新账号。</p><p id="error" role="alert"></p><button id="refresh">刷新</button><button id="pause">暂停接单</button><button id="resume">恢复接单</button><span id="updated" aria-live="polite"></span>
<section><h2>运行状态</h2><pre id="state"></pre><h3>入口与异常</h3><pre id="sources"></pre><pre id="problems"></pre></section>
<section><h2>工单</h2><label>筛选 <select id="filter"><option value="open">开放</option><option value="person">待人工</option><option value="working">工作中</option><option value="idle">等待</option><option value="ended">已结束</option></select></label><table><thead><tr><th>标题</th><th>阶段</th><th>操作</th></tr></thead><tbody id="tickets"></tbody></table><pre id="detail"></pre></section>
<section><h2>配置</h2><p class="muted">先读取再修改；保存包含版本检查，冲突不会覆盖他人修改。账号变化会触发受控重启；不向运行中的 Worker 替换凭证。</p><label>配置块 <select id="block"><option>executor</option><option>eval</option><option>policy</option><option>source:github</option><option>source:feishu</option></select></label><button id="load">读取</button><button id="save">保存</button><textarea id="editor" aria-label="配置 JSON" spellcheck="false"></textarea></section>
<section><h2>来源线程与搜索</h2><label>查询 <input id="query" aria-label="搜索工单、消息或链接"></label><button id="search">搜索</button><label>线程筛选 <select id="threadfilter"><option value="subscribed">订阅中</option><option value="evaluating">待研判</option><option value="recent">最近一天</option><option value="all">全部</option></select></label><button id="threadload">读取线程</button><button id="threadmore">下一页</button><div id="threadrows"></div><pre id="threadview"></pre><button id="earlier">更早消息</button><pre id="searchview"></pre></section>
<section><h2>研判与配置历史</h2><label>研判类型 <select id="decisionkind"><option value="">全部</option><option>accept</option><option>reopen</option><option>ignore</option><option>stop</option><option>unavailable</option></select></label><button id="decisionload">读取研判</button><button id="decisionmore">下一页</button><div id="decisionrows"></div><button id="historyload">配置历史</button><pre id="historyview"></pre><button id="labelrefresh">刷新飞书群名称</button><pre id="labelview"></pre><button id="setupcheck">重新验证账号并受控重启</button></section>
<section><h2>团队 Prompt</h2><button id="promptload">读取</button><button id="promptsave">保存</button><button id="promptpreview">预览</button><button id="prompthistory">历史</button><pre id="promptview"></pre><textarea id="prompteditor" aria-label="团队 Prompt JSON" spellcheck="false"></textarea></section>
<script>
'use strict';
const $=id=>document.getElementById(id);let revision=null,loadedBlock=null,promptRevision=null;
async function api(path,method='GET',body){const r=await fetch('/orchestrator/api/'+path,{method,headers:{'x-orchestrator-request':'1',...(body===undefined?{}:{'content-type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});const v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v;}
function showError(e){$('error').textContent=String(e.message||e)}
function run(f){return async()=>{try{$('error').textContent='';await f()}catch(e){showError(e)}}}
async function refresh(){const [s,o,src,t]=await Promise.all([api('state'),api('overview'),api('sources'),api('tickets?state='+$('filter').value)]);$('state').textContent=JSON.stringify({paused:s.paused,health:s.health,load:s.load,accounts:s.setup.accounts},null,2);$('sources').textContent=JSON.stringify(src,null,2);$('problems').textContent=JSON.stringify(o.problems,null,2);$('updated').textContent='更新于 '+new Date().toLocaleTimeString();$('tickets').replaceChildren();for(const ticket of t.items){const tr=document.createElement('tr');for(const text of [ticket.title,ticket.stage.stage]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td');for(const [title,action] of [['详情',null],['停止','stop'],['重试','retry'],['追加','note']]){const b=document.createElement('button');b.textContent=title;b.onclick=run(async()=>{const path='tickets/'+encodeURIComponent(ticket.id);if(!action){$('detail').textContent=JSON.stringify(await api(path),null,2);return}if(action==='note'){const text=prompt('追加给当前工单的消息');if(text===null)return;await api(path+'/note','POST',{text})}else{if(!confirm(title+'工单 '+ticket.title+'？'))return;await api(path+'/'+action,'POST',{})}await refresh()});td.append(b)}tr.append(td);$('tickets').append(tr)}}
$('refresh').onclick=run(refresh);$('filter').onchange=run(refresh);
for(const [id,paused]of[['pause',true],['resume',false]])$(id).onclick=run(async()=>{await api('executor/pause','POST',{paused});await refresh()});
$('load').onclick=run(async()=>{const s=await api('settings'),block=$('block').value;const item=block.startsWith('source:')?s.sources.find(x=>x.id===block.slice(7)):s.blocks[block];if(!item)throw Error('该配置块未安装');revision=item.revision;loadedBlock=block;$('editor').value=JSON.stringify(item.value,null,2)});
$('save').onclick=run(async()=>{if(loadedBlock!==$('block').value||revision===null)throw Error('请先读取当前配置块');const s=await api('settings/'+encodeURIComponent(loadedBlock),'PUT',{value:JSON.parse($('editor').value),revision});revision=s.revision;await refresh()});
$('promptload').onclick=run(async()=>{const s=await api('prompts');promptRevision=s.current.revision;$('prompteditor').value=JSON.stringify(s.current.config,null,2)});
$('promptsave').onclick=run(async()=>{if(promptRevision===null)throw Error('请先读取 Prompt');const s=await api('prompts','PUT',{config:JSON.parse($('prompteditor').value),baseRevision:promptRevision});promptRevision=s.revision});
let threadOffset=0,threadNext=null,decisionOffset=0,decisionNext=null,currentThread=null,earlier=null;
function renderList(id,rows,actions){$(id).replaceChildren();for(const row of rows){const box=document.createElement('section'),text=document.createElement('pre');text.textContent=JSON.stringify(row,null,2);box.append(text);for(const [label,action]of actions(row)){const b=document.createElement('button');b.textContent=label;b.onclick=run(action);box.append(b)}$(id).append(box)}}
async function threadDetail(key,before){currentThread=key;const s=await api('threads/'+encodeURIComponent(key)+'?limit=30'+(before?'&before='+encodeURIComponent(before):''));$('threadview').textContent=JSON.stringify(s,null,2);earlier=s.earlier;renderList('searchview',s.timeline||[],row=>row.actions.requeue?[['重新研判此消息',async()=>{await api('triggers/'+encodeURIComponent(row.id)+'/requeue','POST',{});await threadDetail(key)}]]:[])}
async function threads(){const s=await api('threads?filter='+$('threadfilter').value+'&offset='+threadOffset);threadNext=s.next_offset;renderList('threadrows',s.items,row=>[['详情',()=>threadDetail(row.key)],['取消订阅',async()=>{if(!confirm('取消线程订阅？'))return;await api('threads/'+encodeURIComponent(row.key)+'/unsubscribe','POST',{});await threads()}]])}
$('threadload').onclick=run(async()=>{threadOffset=0;await threads()});$('threadmore').onclick=run(async()=>{if(threadNext!==null){threadOffset=threadNext;await threads()}});$('earlier').onclick=run(async()=>{if(currentThread&&earlier)await threadDetail(currentThread,earlier)});
$('search').onclick=run(async()=>{$('searchview').textContent=JSON.stringify(await api('search?q='+encodeURIComponent($('query').value)),null,2)});
async function decisions(){const s=await api('decisions?kind='+$('decisionkind').value+'&offset='+decisionOffset);decisionNext=s.next_offset;renderList('decisionrows',s.items,row=>[['线程',()=>threadDetail(row.thread)],['标记已处理',async()=>{await api('decisions/'+encodeURIComponent(row.id)+'/dismiss','POST',{});await decisions()}]])}
$('decisionload').onclick=run(async()=>{decisionOffset=0;await decisions()});$('decisionmore').onclick=run(async()=>{if(decisionNext!==null){decisionOffset=decisionNext;await decisions()}});
$('historyload').onclick=run(async()=>{$('historyview').textContent=JSON.stringify(await api('policy/history'),null,2)});
$('labelrefresh').onclick=run(async()=>{$('labelview').textContent=JSON.stringify(await api('sources/feishu/labels','POST',{}),null,2)});
$('setupcheck').onclick=run(async()=>{if(!confirm('取消当前执行、回收进程并重新验证账号？未完成任务会按恢复规则继续。'))return;await api('setup/check','POST',{});$('updated').textContent='正在受控重启；稍后刷新状态。'});
$('promptpreview').onclick=run(async()=>{$('promptview').textContent=JSON.stringify(await api('prompts/preview','POST',JSON.parse($('prompteditor').value)),null,2)});
$('prompthistory').onclick=run(async()=>{const s=await api('prompts');$('promptview').textContent=JSON.stringify({revisions:s.revisions,next_offset:s.next_offset,parts:s.parts,defaultChanged:s.defaultChanged},null,2)});
run(refresh)();
</script></html>

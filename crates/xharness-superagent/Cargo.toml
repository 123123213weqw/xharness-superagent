[package]
name = "xharness-superagent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable SuperAgent product application, isolated from legacy host defaults"

[features]
# Deterministic clocks for the explicit reference transport, not production.
conformance = ["tokio/test-util"]

[dependencies]
xharness-superagent-core = { path = "../xharness-superagent-core" }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
sha2.workspace = true
tokio-util.workspace = true
xharness-api = { path = "../xharness-api" }
xharness-agent = { path = "../xharness-agent" }
xharness-core = { path = "../xharness-core" }
xharness-host = { path = "../xharness-host" }
xharness-control = { path = "../xharness-control" }
xharness-prompt = { path = "../xharness-prompt" }
xharness-session = { path = "../xharness-session" }
xharness-session-jsonl = { path = "../xharness-session-jsonl" }
xharness-tools = { path = "../xharness-tools" }
xharness-jobs = { path = "../xharness-jobs" }
xharness-process = { path = "../xharness-process" }
xharness-provider-openai = { path = "../xharness-provider-openai" }
xharness-coding-tools = { path = "../xharness-coding-tools" }
xharness-platform = { path = "../xharness-platform" }
xharness-web = { path = "../xharness-web", default-features = false }
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf"] }

[[bin]]
name = "xharness-superagent"
path = "src/bin/superagent.rs"

[[bin]]
name = "superagent-store-bridge"
path = "src/bin/store_bridge.rs"

[[bin]]
name = "superagent-durability-probe"
path = "src/bin/durability_probe.rs"

[[bin]]
name = "superagent-migration-probe"
path = "src/bin/migration_probe.rs"

[[bin]]
name = "superagent-sql-engine-bridge"
path = "src/bin/sql_engine_bridge.rs"

[[bin]]
name = "superagent-native-session-probe"
path = "src/bin/native_session_probe.rs"

[[bin]]
name = "superagent-passes-bridge"
path = "src/bin/passes_bridge.rs"
required-features = ["conformance"]

[[bin]]
name = "superagent-delivery-bridge"
path = "src/bin/delivery_bridge.rs"
required-features = ["conformance"]

[[bin]]
name = "superagent-retry-health-bridge"
path = "src/bin/retry_health_bridge.rs"
required-features = ["conformance"]

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "process"] }
